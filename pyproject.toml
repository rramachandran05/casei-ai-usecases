[project]
name = "casei-geofm"
version = "0.1.0"
description = "CASEI-to-Prithvi-EO labeled data discovery pilot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "shapely>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: tests that hit live external APIs (deselected by default)",
]
testpaths = ["tests"]

[tool.uv]
package = false
