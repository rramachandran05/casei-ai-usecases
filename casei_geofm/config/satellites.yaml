# Ordered satellite search config. Backends and collection ids verified live 2026-09-23:
#   - CMR granule search returns HLSL30/HLSS30 granules with cloud_cover.
#   - CMR does NOT index USGS Landsat C2 or global Sentinel-2 granules (0 results),
#     so those missions use public STAC endpoints instead (documented Plan deviation).
search_order: [HLS, Sentinel-2, Landsat]

missions:
  HLS:
    backend: cmr
    endpoint: https://cmr.earthdata.nasa.gov/search/granules.json
    collections: [HLSL30, HLSS30]
    start_date: "2013-04-11"   # Landsat 8 era; HLS v2 record begins 2013
  Sentinel-2:
    backend: stac
    endpoint: https://earth-search.aws.element84.com/v1/search
    collections: [sentinel-2-l2a]
    start_date: "2015-06-23"
  Landsat:
    backend: stac
    endpoint: https://landsatlook.usgs.gov/stac-server/search
    collections: [landsat-c2l2-sr]
    start_date: "1972-07-23"

# Prithvi temporal-sequence check: flag when >= this many usable scenes exist
# in the phenomenon window around the observation.
sequence_min_scenes: 4
